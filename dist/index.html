    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Matchkeeper" />
    <link rel="apple-touch-icon" href="/logo-icon-192.png" />

    <title>Matchkeeper</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: 'Inter', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
      @keyframes liveDotPulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.72); } }
      /* Boot/loading screen (App.jsx's authLoading branch) — spinning logo ring + status dots. */
      @keyframes mkRingSpin { to { transform: rotate(360deg); } }
      @keyframes mkGlowPulse { 0%, 100% { opacity: .5; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.04); } }
      @keyframes mkDotFade { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
      /* Home screen (EvList) — staggered entrance + hero glow/bar-fill, previewed as an Artifact
         before implementation ("Concept A — Focused Hero"). */
      @keyframes mkFadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes mkHeroGlow { 0%, 100% { box-shadow: 0 0 0 0.5px #3730a3aa, 0 0 18px 0 rgba(99,102,241,0); } 50% { box-shadow: 0 0 0 0.5px #6366F1cc, 0 0 22px 2px rgba(99,102,241,.35); } }
      .mk-animate-in { opacity: 0; animation: mkFadeUp .55s cubic-bezier(.16,1,.3,1) forwards; }
      /* mkFadeUp deliberately NOT on .mk-hero itself (only mkHeroGlow, which just pulses
         box-shadow) — a "both"-fill-mode animation on transform/opacity holds those two
         properties for as long as the class is applied, silently overriding any inline
         transform/opacity the card sets later for the drag-swipe carousel (App.jsx's
         heroSlotBase). The one-time entrance fade instead lives on a plain .mk-animate-in
         wrapper one level up, which never touches transform/opacity again after it finishes. */
      .mk-hero { animation: mkHeroGlow 2.6s ease-in-out .7s infinite; }
      @media (prefers-reduced-motion: reduce) {
        .mk-animate-in, .mk-hero { animation: none !important; opacity: 1 !important; transform: none !important; }
      }
    </style>
    <script type="module" crossorigin src="/assets/main-BQZDSLBB.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
